[project]
name = "ppa"
version = "0.1.0"
description = "Practice slots for LangGraph and Claude Agent SDK agents, routed through Atlan's LiteLLM Gateway."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.1.4",
    "litellm>=1.50.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1.0",
    "claude-agent-sdk>=0.1.0",
    "streamlit>=1.40",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
