<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Strict CSP: everything is same-origin/local; the only outbound calls are XHR to the
       API origin (connect-src). No inline script/style, so no 'unsafe-inline' is needed —
       app.js and styles.css are external files. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>agent-sentry</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">agent-sentry</h1>
    <div class="conn">
      <!-- Credentials are auto-loaded from .env (frontend/config.js, generated by
           start-ui.sh). This block is shown only as a fallback when no config is injected. -->
      <div id="conn-creds" class="conn-creds">
        <label>API base
          <input id="base-url" type="text" value="http://127.0.0.1:8787" spellcheck="false" autocomplete="off" />
        </label>
        <label>API key
          <input id="api-key" type="password" placeholder="SENTRY_API_KEY" autocomplete="off" />
        </label>
        <button id="connect-btn" type="button">Connect</button>
      </div>
      <span id="conn-status" class="status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <div class="layout">
    <nav id="skill-nav" class="nav" aria-label="Skills">
      <p class="nav-empty">Connect to load skills.</p>
    </nav>

    <main class="main">
      <section id="skill-panel" class="panel hidden">
        <h2 id="skill-name"></h2>
        <p id="skill-desc" class="desc"></p>
        <p id="skill-hint" class="hint hidden"></p>

        <form id="run-form" class="run-form" autocomplete="off">
          <label class="field">Prompt <span class="muted">(optional)</span>
            <textarea id="prompt" rows="3" placeholder="Optional free-form request for the skill…"></textarea>
          </label>
          <div class="row">
            <label class="field narrow">Timeframe (hours) <span class="muted">(optional)</span>
              <input id="timeframe" type="number" min="1" max="720" placeholder="e.g. 24" />
            </label>
            <label class="checkbox">
              <input id="dry-run" type="checkbox" checked />
              Dry run <span class="muted">(write briefing, skip relay + Graphiti)</span>
            </label>
          </div>
          <button id="run-btn" type="submit">Run skill</button>
        </form>

        <div id="run-status" class="status" role="status" aria-live="polite"></div>
        <div id="chips" class="chips"></div>
        <article id="output" class="output" aria-live="polite"></article>

        <!-- Feedback widget: appears once a briefing renders. 👍/👎 + optional comment ->
             POST /feedback. The agent distills it into durable preferences so future runs
             improve. Rating is required to submit; 👎 reveals a "what was off?" prompt. -->
        <section id="feedback" class="feedback hidden" aria-label="Briefing feedback">
          <span class="fb-q">Was this briefing useful?</span>
          <div class="fb-rate" role="radiogroup" aria-label="Rating">
            <button id="fb-up" type="button" class="fb-thumb" aria-pressed="false" title="Helpful">👍</button>
            <button id="fb-down" type="button" class="fb-thumb" aria-pressed="false" title="Not helpful">👎</button>
          </div>
          <label class="field" id="fb-comment-field">
            <span id="fb-comment-label" class="muted">Comment <span class="muted">(optional)</span></span>
            <textarea id="fb-comment" rows="2" maxlength="2000"
                      placeholder="What should change next time? (teaches a durable preference)"></textarea>
          </label>
          <button id="fb-submit" type="button" disabled>Send feedback</button>
          <div id="fb-status" class="status" role="status" aria-live="polite"></div>
        </section>
      </section>

      <section id="placeholder" class="placeholder">
        <p>Select a skill from the left to run it.</p>
      </section>
    </main>
  </div>

  <!-- Generated from .env by start-ui.sh; sets window.SENTRY_CONFIG (base URL + API key) so
       the user never types credentials. Absent (404, harmless) when started another way —
       app.js then falls back to the manual connect form. -->
  <script src="config.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
